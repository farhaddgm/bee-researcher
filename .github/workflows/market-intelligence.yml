name: Market Intelligence

on:
  # Required branch checks must exist even for documentation-only PRs;
  # path-filtered required workflows leave those PRs permanently pending.
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/market_intelligence/**"
      - "ops/scoped-release/**"
      - ".github/workflows/market-intelligence.yml"

jobs:
  news-chat-browser:
    name: Required isolated news-chat acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: unit-and-contract
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build candidate without runtime secrets
        run: docker build --tag bee-researcher-chat-ci src/market_intelligence
      - name: Required real SQL and browser gates with synthetic providers
        run: python3 ops/scoped-release/verify_news_chat.py --image bee-researcher-chat-ci

  unit-and-contract:
    runs-on: ubuntu-24.04
    env:
      MARKET_INTELLIGENCE_POSTGRES_DB: assistant_test
      MARKET_INTELLIGENCE_POSTGRES_USER: assistant_test
      MARKET_INTELLIGENCE_POSTGRES_PASSWORD: test-password
      MARKET_INTELLIGENCE_ENVIRONMENT: test
      MARKET_INTELLIGENCE_SCHEDULER_ENABLED: "false"
      MARKET_INTELLIGENCE_TELEGRAM_POLLING_ENABLED: "false"
      MARKET_INTELLIGENCE_REDIS_PASSWORD: test-password
      MARKET_INTELLIGENCE_CSRF_SIGNING_SECRET: ci-test-only-signing-secret-at-least-32
      MARKET_INTELLIGENCE_MFA_ENCRYPTION_SECRET: ci-test-only-encryption-secret-at-least-32
      POSTGRES_DB: assistant_test
      POSTGRES_USER: assistant_test
      POSTGRES_PASSWORD: test-password
      REDIS_PASSWORD: test-password
      QDRANT_API_KEY: test-key
      OPENAI_API_KEY: test-key
      TELEGRAM_BOT_TOKEN: test-token
      ALLOWED_TELEGRAM_USER_ID: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/market_intelligence/requirements.txt
      - name: Install dependencies
        run: pip install -r src/market_intelligence/requirements.txt
      - name: Compile and run unit tests
        env:
          PYTHONPATH: src/market_intelligence
        run: |
          python -m compileall -q src/market_intelligence
          python -m unittest discover -s src/market_intelligence/tests -v
          python -m unittest discover -s ops/scoped-release/tests -v
      - name: Enforce CSP migration inline budget
        run: python src/market_intelligence/scripts/check_csp_inline_budget.py
      - name: Validate UX-writing locale catalog
        run: python src/market_intelligence/scripts/check_i18n_catalog.py
      - name: Render isolated migration SQL
        working-directory: src/market_intelligence
        run: alembic upgrade head --sql > /tmp/market-intelligence.sql

  browser-smoke:
    name: Required local authenticated browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: unit-and-contract
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: assistant_test
          POSTGRES_USER: assistant_test
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant_test -d assistant_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MARKET_INTELLIGENCE_POSTGRES_DB: assistant_test
      MARKET_INTELLIGENCE_POSTGRES_USER: assistant_test
      MARKET_INTELLIGENCE_POSTGRES_PASSWORD: test-password
      MARKET_INTELLIGENCE_POSTGRES_HOST: 127.0.0.1
      MARKET_INTELLIGENCE_REDIS_PASSWORD: test-password
      MARKET_INTELLIGENCE_REDIS_HOST: 127.0.0.1
      MARKET_INTELLIGENCE_ENVIRONMENT: test
      MARKET_INTELLIGENCE_ADMIN_COOKIE_SECURE: "false"
      MARKET_INTELLIGENCE_CSRF_SIGNING_SECRET: test-only-ci-csrf-signing-secret-32-bytes
      MARKET_INTELLIGENCE_ADMIN_BOOTSTRAP_USERNAME: ci-admin
      MARKET_INTELLIGENCE_ADMIN_BOOTSTRAP_PASSWORD: ci-only-password-not-for-production
      MARKET_INTELLIGENCE_ADMIN_OWNER_USERNAME: ci-admin
      MARKET_INTELLIGENCE_SCHEDULER_ENABLED: "false"
      MARKET_INTELLIGENCE_TELEGRAM_POLLING_ENABLED: "false"
      MARKET_INTELLIGENCE_OPENAI_API_KEY: test-key
      MARKET_INTELLIGENCE_TELEGRAM_BOT_TOKEN: test-token
      BEE_ADMIN_URL: http://127.0.0.1:8010/admin
      BEE_USER_URL: http://127.0.0.1:8010/user
      CAPTURE_OUTPUT: /tmp/bee-researcher-browser
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/market_intelligence/package-lock.json
      - name: Install pinned browser harness
        working-directory: src/market_intelligence
        run: npm ci --ignore-scripts
      - name: Install Chromium
        working-directory: src/market_intelligence
        run: npx playwright install --with-deps chromium
      - name: Install application dependencies
        run: |
          python -m pip install --disable-pip-version-check -r src/market_intelligence/requirements.txt
      - name: Start an isolated migrated application
        run: |
          docker run --detach --name bee-researcher-e2e-redis --publish 6379:6379 redis:7-alpine redis-server --requirepass test-password
          redis_ready=0
          for attempt in $(seq 1 30); do
            if docker exec bee-researcher-e2e-redis redis-cli -a test-password ping 2>/dev/null | grep -q PONG; then
              redis_ready=1
              break
            fi
            sleep 1
          done
          if [ "$redis_ready" -ne 1 ]; then
            echo "Redis did not become ready after $attempt attempts."
            docker logs bee-researcher-e2e-redis
            exit 1
          fi
          cd src/market_intelligence
          alembic upgrade head
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=src/market_intelligence uvicorn app.main:app --host 127.0.0.1 --port 8010 --no-access-log > /tmp/bee-researcher-e2e.log 2>&1 &
          echo $! > /tmp/bee-researcher-e2e.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8010/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Application health check did not pass after $attempt attempts."
          cat /tmp/bee-researcher-e2e.log
          exit 1
      - name: Capture Admin inventory
        timeout-minutes: 5
        working-directory: src/market_intelligence
        run: npm run admin:inventory
      - name: Required Admin interactions
        timeout-minutes: 4
        working-directory: src/market_intelligence
        run: npm run admin:interactions
      - name: Required eight-locale E2E
        timeout-minutes: 5
        working-directory: src/market_intelligence
        run: npm run admin:locales
      - name: Required support conversation E2E
        timeout-minutes: 4
        working-directory: src/market_intelligence
        run: npm run admin:support:e2e
      - name: Required user portal E2E
        timeout-minutes: 4
        working-directory: src/market_intelligence
        run: npm run user:e2e
      - name: Required media and relevance E2E
        timeout-minutes: 4
        working-directory: src/market_intelligence
        run: npm run admin:media:e2e
      - name: Required model settings E2E
        timeout-minutes: 3
        working-directory: src/market_intelligence
        run: npm run admin:models:e2e
      - name: Required backoffice UI E2E
        # 384 locale/viewport/view combinations plus interaction assertions.
        # Measured successful runs take ~4 min; retain bounded runner headroom.
        timeout-minutes: 6
        working-directory: src/market_intelligence
        run: npm run ui:e2e
      - name: Required research context E2E
        timeout-minutes: 3
        working-directory: src/market_intelligence
        run: npm run admin:research-context:e2e
      - name: Required account access E2E
        timeout-minutes: 3
        working-directory: src/market_intelligence
        run: npm run admin:accounts:e2e
      - name: Required catalog viewport E2E
        timeout-minutes: 4
        working-directory: src/market_intelligence
        run: npm run admin:catalog:e2e
      - name: Required accessibility E2E
        timeout-minutes: 4
        working-directory: src/market_intelligence
        run: npm run admin:accessibility:e2e
      - name: Preserve isolated E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/bee-researcher-e2e.log
            /tmp/bee-researcher-browser/**/manifest.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Run isolated account and signed Google OIDC integration
        working-directory: src/market_intelligence
        env:
          PYTHONPATH: .
          MARKET_INTELLIGENCE_OPENAI_API_KEY: ""
          MARKET_INTELLIGENCE_TELEGRAM_BOT_TOKEN: ""
          MARKET_INTELLIGENCE_GOOGLE_CLIENT_ID: ""
          MARKET_INTELLIGENCE_GOOGLE_CLIENT_SECRET: ""
          MARKET_INTELLIGENCE_GOOGLE_REDIRECT_URI: ""
        run: |
          python scripts/verify_account_access_sql.py
          # The browser suite is finished; avoid concurrent access during rollback.
          kill "$(cat /tmp/bee-researcher-e2e.pid)"
          python scripts/verify_account_migration.py
      - name: Run isolated SQL media and publication integration
        env:
          PYTHONPATH: src/market_intelligence
          MARKET_INTELLIGENCE_OPENAI_API_KEY: ""
          MARKET_INTELLIGENCE_TELEGRAM_BOT_TOKEN: ""
        run: |
          python src/market_intelligence/scripts/verify_media_pipeline.py
          python src/market_intelligence/scripts/verify_product_reliability.py
          python src/market_intelligence/scripts/verify_job_recovery.py
          python src/market_intelligence/scripts/verify_deployment_drain.py
          MARKET_INTELLIGENCE_DEPLOYMENT_DRAIN_ENABLED=true python ops/scoped-release/verify_http_drain.py
      - name: Run isolated business research context SQL integration
        env:
          PYTHONPATH: src/market_intelligence
          MARKET_INTELLIGENCE_OPENAI_API_KEY: ""
          MARKET_INTELLIGENCE_TELEGRAM_BOT_TOKEN: ""
          MARKET_INTELLIGENCE_CONTENTER_API_URL: https://contenter-review.invalid/api
          MARKET_INTELLIGENCE_CONTENTER_WEB_URL: https://contenter-review.invalid
          MARKET_INTELLIGENCE_CONTENTER_TOKEN: synthetic-ci-contenter-token-0123456789
        run: python src/market_intelligence/scripts/verify_research_context_sql.py
      - name: Stop isolated application
        if: always()
        run: |
          if [ -f /tmp/bee-researcher-e2e.pid ]; then kill "$(cat /tmp/bee-researcher-e2e.pid)" || true; fi
          docker rm --force bee-researcher-e2e-redis >/dev/null 2>&1 || true

  static-analysis:
    name: Static analysis and policy gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.13"
      - name: Install pinned analysis tools
        run: python -m pip install --disable-pip-version-check ruff==0.12.10 mypy==1.17.1 bandit==1.8.6
      - name: Install application type information
        run: python -m pip install --disable-pip-version-check -r src/market_intelligence/requirements.txt
      - name: Ruff
        run: ruff check --config src/market_intelligence/ruff.toml src/market_intelligence/app src/market_intelligence/tests
      - name: Bandit
        # Both UI files are static HTML/CSS/JS templates, not executable Python
        # SQL; Bandit's SQL-string rule otherwise scans embedded browser code.
        run: bandit -q -r src/market_intelligence/app -ll -x '*/admin_ui.py,*/user_ui.py'
      - name: Mypy
        # Keep the type checker blocking: the service is currently at zero
        # diagnostics. The baseline comparison adds a clear regression summary.
        run: |
          mypy src/market_intelligence/app --ignore-missing-imports
          python src/market_intelligence/scripts/check_mypy_regressions.py

  security-supply-chain:
    name: Supply-chain security gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/market_intelligence/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r src/market_intelligence/requirements.txt
      - name: Build immutable release candidate
        run: |
          docker build --build-arg "SOURCE_REVISION=${GITHUB_SHA}" --file src/market_intelligence/Dockerfile --tag "bee-researcher-market-intelligence:${GITHUB_SHA}" src/market_intelligence
          REVISION="$(docker image inspect "bee-researcher-market-intelligence:${GITHUB_SHA}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$REVISION" = "$GITHUB_SHA"
      - name: Prepare release artifact directory
        run: mkdir -p artifacts
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.20.5
        with:
          image: bee-researcher-market-intelligence:${{ github.sha }}
          format: cyclonedx-json
          output-file: artifacts/market-intelligence-sbom.cdx.json
          upload-artifact: true
      - name: Scan image and base OS
        # Pin to the verified v0.36.0 release commit; immutable refs keep CI reproducible.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bee-researcher-market-intelligence:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Save the scanned image for promotion
        run: |
          docker save "bee-researcher-market-intelligence:${GITHUB_SHA}" | gzip -c > artifacts/market-intelligence-image.tar.gz
      - name: Upload the scanned image and its SBOM for promotion
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-candidate-${{ github.sha }}
          path: |
            artifacts/market-intelligence-image.tar.gz
            artifacts/market-intelligence-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  publish-sign:
    name: Publish and sign verified release candidate
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [unit-and-contract, browser-smoke, news-chat-browser, static-analysis, security-supply-chain]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Download the exact scanned image and SBOM
        uses: actions/download-artifact@v4
        with:
          name: market-intelligence-candidate-${{ github.sha }}
          path: artifacts
      - name: Load the scanned immutable image
        run: gzip -dc artifacts/market-intelligence-image.tar.gz | docker load
      - name: Install Cosign for promoted-image verification
        uses: sigstore/cosign-installer@v3.8.1
      - name: Publish the scanned immutable image to GHCR
        id: publish-image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          IMAGE_NAME="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')-market-intelligence"
          IMAGE_REF="$IMAGE_NAME:${GITHUB_SHA}"
          docker tag "bee-researcher-market-intelligence:${GITHUB_SHA}" "$IMAGE_REF"
          docker push "$IMAGE_REF" | tee /tmp/market-intelligence-image-push.log
          DIGEST="$(bash src/market_intelligence/scripts/extract_image_digest.sh < /tmp/market-intelligence-image-push.log)"
          {
            echo "image_name=$IMAGE_NAME"
            echo "image_ref=$IMAGE_NAME@$DIGEST"
            echo "image_tag=$IMAGE_REF"
          } >> "$GITHUB_OUTPUT"
      - name: Sign immutable image digest and attest SBOM
        env:
          IMAGE_REF: ${{ steps.publish-image.outputs.image_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type cyclonedx --predicate artifacts/market-intelligence-sbom.cdx.json "$IMAGE_REF"
          IMAGE_DIGEST="${IMAGE_REF##*@sha256:}"
          printf '{"source_repository":"%s","source_commit":"%s","workflow":"%s","image_digest":"sha256:%s"}\n' \
            "$REPOSITORY" "$GITHUB_SHA" "$GITHUB_WORKFLOW" "$IMAGE_DIGEST" \
            > artifacts/market-intelligence-build-binding.json
          cosign attest --yes --type custom --predicate artifacts/market-intelligence-build-binding.json "$IMAGE_REF"
      - name: Verify image signature and SBOM attestation
        env:
          IMAGE_REF: ${{ steps.publish-image.outputs.image_ref }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/market-intelligence.yml@refs/heads/main
        run: |
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_REF"
          cosign verify-attestation --type cyclonedx --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_REF" > /tmp/market-intelligence-verified-attestation.json
          cosign verify-attestation --type custom --certificate-identity "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_REF" > /tmp/market-intelligence-verified-build-binding.json
          printf '{"image":"%s","commit":"%s"}\n' "$IMAGE_REF" "$GITHUB_SHA" > artifacts/market-intelligence-release-trace.json
          cp artifacts/market-intelligence-build-binding.json artifacts/market-intelligence-release-build-binding.json
      - name: Upload release trace
        uses: actions/upload-artifact@v4
        with:
          name: market-intelligence-release-trace-${{ github.sha }}
          path: |
            artifacts/market-intelligence-release-trace.json
            artifacts/market-intelligence-release-build-binding.json
          if-no-files-found: error
